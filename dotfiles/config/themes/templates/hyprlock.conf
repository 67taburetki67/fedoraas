general {
  hide_cursor = true
}

background {
  monitor =
  {{LOCKBG}}
  blur_passes = 3
  blur_size = 6
  brightness = 0.45
  noise = 0.05
}

label {
  monitor =
  text = cmd[update:1000] date +%H:%M
  color = rgb({{FG}})
  font_size = 110
  font_family = JetBrains Mono
  position = 0, 140
  halign = center
  valign = center
}

label {
  monitor =
  text = cmd[update:60000] date "+%A, %d %B"
  color = rgb({{DIM}})
  font_size = 20
  font_family = JetBrains Mono
  position = 0, 40
  halign = center
  valign = center
}

input-field {
  monitor =
  size = 280, 48
  outline_thickness = 1
  rounding = 18
  outer_color = rgb({{LINE}})
  inner_color = rgba({{BG}}b3)
  font_color = rgb({{FG}})
  check_color = rgb({{DIM}})
  fail_color = rgb({{MUTED}})
  fade_on_empty = true
  placeholder_text = ...
  fail_text = неверно
  position = 0, -60
  halign = center
  valign = center
}
