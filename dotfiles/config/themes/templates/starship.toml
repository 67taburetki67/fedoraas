add_newline = true
format = "$directory$git_branch$git_status$cmd_duration$line_break$character"

[directory]
style = "fg:#{{DIM}}"
truncation_length = 3
truncation_symbol = "…/"
format = "[$path]($style) "

[git_branch]
symbol = ""
style = "fg:#{{MUTED}}"
format = "[$branch]($style) "

[git_status]
style = "fg:#{{MUTED}}"
format = "[$all_status$ahead_behind]($style) "

[cmd_duration]
min_time = 2000
style = "fg:#{{MUTED}}"
format = "[$duration]($style) "

[character]
success_symbol = "[❯](fg:#{{FG}})"
error_symbol = "[❯](fg:#{{MUTED}})"
